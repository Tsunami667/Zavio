function loanCatId(){
  var c=db.cats.filter(function(x){return !x.parentId&&/^cr[ée]dit/i.test(x.name);})[0];
  if(!c){c={id:uid(),name:'Crédit',icon:'🏦',color:'#6c757d',type:'exp',parentId:''};db.cats.push(c);}
  return c.id;
}
function loanSheet(l,presetAsset,modeArg,draft){
  var isNew=!l;
  draft=draft||{};
  var simple=modeArg?modeArg==='simple':(isNew||!!(l&&l.simple));
  var canSwitch=isNew||!!(l&&l.simple);
  var d0=(l&&!l.simple)?l:null;
  var nm=draft.name!==undefined?draft.name:(l?l.name:'');
  var as0=draft.asset!==undefined?draft.asset:(l?l.assetId:presetAsset);
  function wireMode(){
    if(!$('lMode'))return;
    $('lMode').onclick=function(e){
      var b=e.target.closest('button');if(!b)return;
      var m=b.getAttribute('data-m');if((m==='simple')===simple)return;
      loanSheet(l,presetAsset,m,{name:$('lName').value,asset:$('lAsset').value});
    };
  }
  var h='<h2>'+(isNew?'Nouveau crédit':'Modifier le crédit')+'</h2>';
  if(canSwitch)h+='<div class="seg" id="lMode" style="margin-bottom:4px"><button data-m="detail" class="exp '+(simple?'':'on')+'">Détaillé</button><button data-m="simple" class="exp '+(simple?'on':'')+'">Juste le solde</button></div>';
  h+='<label'+(canSwitch?'':' style="margin-top:0"')+'>Nom</label><input id="lName" value="'+esc(nm)+'" placeholder="Ex. Crédit immobilier, Prêt auto">';
  h+='<label>Bien concerné (facultatif)</label><select id="lAsset"><option value="">Aucun</option>'+db.assets.map(function(a){return '<option value="'+a.id+'"'+(as0===a.id?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select>';
  if(simple){
    h+='<label>Montant restant dû ('+esc(cur())+')</label><input id="lBal" inputmode="decimal" value="'+(l&&l.simple?numIn(l.balance):'')+'" placeholder="0,00">';
    h+='<div class="note">Pratique si tu n\'as pas le taux, la durée ou le tableau d\'amortissement : seul le solde restant compte dans ton patrimoine. Sans mensualité, ce montant reste fixe : pense à le mettre à jour de temps en temps.'+(l&&l.simple&&l.balanceDate?' Dernière mise à jour : '+esc(parse(l.balanceDate).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}))+'.':'')+'</div>';
    h+='<label>Mensualité (facultatif)</label><input id="lSMo" inputmode="decimal" value="'+(l&&l.simple&&+l.monthly>0?numIn(l.monthly):'')+'" placeholder="Ex. 850">';
    h+='<label>Taux annuel en % (facultatif)</label><input id="lSRate" inputmode="decimal" value="'+(l&&l.simple&&+l.rate>0?numIn(l.rate):'')+'" placeholder="Ex. 3,5">';
    h+='<label>Cette mensualité est…</label><select id="lSB"><option value="0"'+(l&&l.simple&&l.monthlyInBudget?'':' selected')+'>pas encore dans mon budget</option><option value="1"'+(l&&l.simple&&l.monthlyInBudget?' selected':'')+'>déjà dans une opération récurrente</option></select>';
    h+='<div id="lSRBox" style="display:none"><label>Quelle opération récurrente ?</label><select id="lSR">'+ruleOptions(l&&l.simple&&l.monthlyRuleId)+'</select>'+(linkRules().length?'':'<div class="note">Aucune dépense récurrente trouvée. Crée-la d\'abord dans l\'onglet Récurrentes, ou choisis « pas encore dans mon budget ».</div>')+'</div>';
    h+='<div class="note">Avec la mensualité (et si possible le taux), le solde diminue tout seul chaque mois à partir d\'aujourd\'hui. « Pas encore dans mon budget » : la projection retire la mensualité de tes comptes. « Déjà dans une opération récurrente » : tu choisis ta récurrente, qui retire déjà l\'argent du compte, et rien n\'est compté deux fois. Sans taux, tout le montant sert à rembourser le capital.</div>';
    h+='<button class="btn" id="lSave">Enregistrer</button>';
    if(!isNew)h+='<button class="btn del" id="lDel">Supprimer</button>';
    h+='<button class="btn sec" id="lCancel">Annuler</button>';
    openSheet(h);
    var syncLoan=function(){$('lSRBox').style.display=$('lSB').value==='1'?'block':'none';};
    $('lSB').onchange=syncLoan;syncLoan();
    wireMode();
    $('lCancel').onclick=closeSheet;
    $('lSave').onclick=function(){
      var n1=$('lName').value.trim();if(!n1){toast('Donne un nom au crédit');return;}
      var b=parseAmount($('lBal').value);
      if(!(b>0)){toast('Montant restant invalide');return;}
      var mo1=$('lSMo').value.trim()===''?0:parseAmount($('lSMo').value);
      var rt1=$('lSRate').value.trim()===''?0:parseAmount($('lSRate').value);
      if(mo1===null||mo1<0){toast('Mensualité invalide');return;}
      if(rt1===null||rt1<0){toast('Taux invalide');return;}
      var on1=$('lSB').value==='1',mr1='';
      if(on1){mr1=$('lSR').value;if(!mr1){toast('Choisis l\'opération récurrente');return;}var rr1=byId(db.rules,mr1);if(mo1===0&&rr1)mo1=Math.abs(rr1.amount);}
      var t1=todayStr();
      var o={name:n1,assetId:$('lAsset').value,simple:true,balance:r2(b),balanceDate:t1,principal:r2(b),rate:rt1,months:0,first:t1,monthly:r2(mo1),monthlyInBudget:on1,monthlyRuleId:mr1};
      if(isNew){o.id=uid();o.ruleId='';db.loans.push(o);}
      else for(var k1 in o)l[k1]=o[k1];
      save();closeSheet();render();
    };
    if($('lDel'))$('lDel').onclick=function(){
      choose('Supprimer « '+l.name+' » ?',[{label:'Supprimer le crédit',cls:'del',fn:function(){db.loans=db.loans.filter(function(x){return x!==l;});save();closeSheet();render();}},{label:'Annuler',cls:'sec'}]);
    };
    return;
  }
  h+='<label>Capital emprunté ('+esc(cur())+')</label><input id="lCap" inputmode="decimal" value="'+numIn(d0&&d0.principal)+'" placeholder="0,00">';
  h+='<label>Taux annuel (%)</label><input id="lRate" inputmode="decimal" value="'+(d0?numIn(d0.rate):'')+'" placeholder="Ex. 3,5 (hors assurance)">';
  h+='<label>Durée (en mois)</label><input id="lMonths" inputmode="numeric" value="'+(d0?d0.months:'')+'" placeholder="Ex. 240 pour 20 ans">';
  h+='<label>Date de la 1re mensualité</label><input type="date" id="lFirst" value="'+esc(d0?d0.first:todayStr())+'">';
  h+='<label>Mensualité (laisse vide pour la calculer)</label><input id="lMonthly" inputmode="decimal" value="'+(d0?numIn(d0.monthly):'')+'" placeholder="Calculée automatiquement">';
  h+='<div class="note" id="lNote"></div>';
  var hasRule=l&&l.ruleId&&byId(db.rules,l.ruleId);
  if(hasRule)h+='<div class="note">Les mensualités sont déjà dans tes opérations récurrentes. Pour changer leur montant, modifie-les dans l\'onglet Récurrentes.</div>';
  else{
    h+='<label class="chkrow"><input type="checkbox" id="lRule"'+(isNew||(l&&l.simple)?' checked':'')+'> Ajouter les mensualités à mon budget</label>';
    h+='<label>Compte débité</label><select id="lAcc">'+db.accounts.map(function(a){return '<option value="'+a.id+'"'+(a.id===curAcc().id?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select>';
  }
  h+='<button class="btn" id="lSave">Enregistrer</button>';
  if(!isNew)h+='<button class="btn del" id="lDel">Supprimer</button>';
  h+='<button class="btn sec" id="lCancel">Annuler</button>';
  openSheet(h);
  wireMode();
  function read(){
    var P=parseAmount($('lCap').value),rt=$('lRate').value.trim()===''?0:parseAmount($('lRate').value),n=parseInt($('lMonths').value,10);
    var mo=$('lMonthly').value.trim()===''?null:parseAmount($('lMonthly').value);
    return {P:P,rt:rt,n:n,mo:mo};
  }
  function upd(){
    var v=read(),el=$('lNote');
    if(v.P>0&&v.rt!==null&&v.rt>=0&&v.n>0){
      var m=v.mo>0?v.mo:loanCalc(v.P,v.rt,v.n);
      el.textContent='Mensualité '+money(m)+' · coût total des intérêts : '+money(r2(m*v.n-v.P));
    }else el.textContent='Renseigne le capital, le taux et la durée pour calculer la mensualité.';
  }
  ['lCap','lRate','lMonths','lMonthly'].forEach(function(id){$(id).oninput=upd;});
  upd();
  $('lCancel').onclick=closeSheet;
  $('lSave').onclick=function(){
    var n0=$('lName').value.trim();if(!n0){toast('Donne un nom au crédit');return;}
    var v=read();
    if(!(v.P>0)){toast('Capital invalide');return;}
    if(v.rt===null||v.rt<0){toast('Taux invalide');return;}
    if(!(v.n>=1&&v.n<=600)){toast('Durée invalide (1 à 600 mois)');return;}
    if(v.mo===null&&$('lMonthly').value.trim()!==''){toast('Mensualité invalide');return;}
    if(!$('lFirst').value){toast('Indique la date de la 1re mensualité');return;}
    var mo=v.mo>0?r2(v.mo):loanCalc(v.P,v.rt,v.n);
    var obj={name:n0,assetId:$('lAsset').value,principal:v.P,rate:v.rt,months:v.n,first:$('lFirst').value,monthly:mo,simple:false};
    if(isNew){obj.id=uid();obj.ruleId='';l=obj;db.loans.push(l);}
    else{for(var k in obj)l[k]=obj[k];delete l.balance;delete l.balanceDate;}
    if(!hasRule&&$('lRule')&&$('lRule').checked){
      var t=todayStr(),paid=loanPaid(l,t);
      if(paid<l.months){
        var rule={id:uid(),title:l.name,note:'',amount:-l.monthly,catId:loanCatId(),freq:'m',interval:1,start:addMonths(l.first,paid),end:'',nextIndex:0,accId:$('lAcc').value,pattern:'same',wk:'',count:l.months-paid,est:false};
        db.rules.push(rule);l.ruleId=rule.id;
      }else toast('Crédit déjà terminé : aucune mensualité à planifier');
    }
    save();closeSheet();render();
  };
  if($('lDel'))$('lDel').onclick=function(){
    var rl=l.ruleId?byId(db.rules,l.ruleId):null;
    var opts=[{label:'Supprimer le crédit',cls:'del',fn:function(){db.loans=db.loans.filter(function(x){return x!==l;});save();closeSheet();render();}}];
    if(rl)opts.unshift({label:'Supprimer le crédit et ses mensualités à venir',cls:'del',fn:function(){deleteRule(rl);db.loans=db.loans.filter(function(x){return x!==l;});save();closeSheet();render();}});
    opts.push({label:'Annuler',cls:'sec'});
    choose('Supprimer « '+l.name+' » ?',opts);
  };
}

    else{pointTx(t,function(){save();render(true);});}
  }return;}
  var row=e.target.closest('.row');
  if(row){
    if(row.hasAttribute('data-cat')){catSheet(catById(row.getAttribute('data-cat')));return;}
    if(row.hasAttribute('data-hist')){histSheet();return;}
    if(row.hasAttribute('data-asset')){assetSheet(assetById(row.getAttribute('data-asset')));return;}
    if(row.hasAttribute('data-loan')){loanSheet(loanById(row.getAttribute('data-loan')));return;}
    if(row.hasAttribute('data-rule')){formSheet('rule',ruleById(row.getAttribute('data-rule')));return;}
    if(row.classList.contains('open')){closeOpenRows();return;}
    var tx=txById(row.getAttribute('data-id'));if(tx)formSheet('tx',tx);return;
  }
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='pQuick'||b.id==='pQuick2'){quickSheet();return;}
  if(b.hasAttribute('data-color')){db.settings.color=b.getAttribute('data-color');save();applyTheme();render(true);toast('Couleur modifiée');return;}
  if(b.id==='sSave'){
    db.settings.cur=$('sCur').value.trim()||'€';
    db.settings.alertOn=$('sAlertOn').value==='1';
    var th=parseAmount($('sAlertTh').value);db.settings.alertBelow=th===null?0:th;
    dismissed={};
    save();toast('Réglages enregistrés');render();
  }else if(b.id==='sCsv'){
    var csv=buildCsv();
    var canShare=false;
    try{canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[new File(['x'],'a.csv',{type:'text/csv'})]}));}catch(er){}
    openSheet('<h2>Export CSV</h2><div class="note">'+db.txs.length+' opération'+(db.txs.length>1?'s':'')+', triées par date. Séparateur « ; » et virgule décimale : le fichier s\'ouvre directement dans Excel ou Sheets en français.</div><label>Contenu</label><textarea id="bk" readonly></textarea><button class="btn" id="bkCopy">Copier</button>'+(canShare?'<button class="btn sec" id="bkShare">Partager en fichier .csv</button>':'')+'<button class="btn sec" id="bkClose">Fermer</button>');
    $('bk').value=csv;
    $('bkClose').onclick=closeSheet;
    $('bkCopy').onclick=function(){copyFrom($('bk'));};
    if($('bkShare'))$('bkShare').onclick=function(){
      navigator.share({files:[new File(['\ufeff'+csv],'zavio.csv',{type:'text/csv'})],title:'Zavio'}).catch(function(){toast('Partage impossible, utilise Copier');});
    };
  }else if(b.id==='sExp'||b.id==='sBackupNow'){
    openSheet('<h2>Sauvegarde</h2><div class="note">Copie ce texte et garde-le dans une note ou un message à toi-même.</div><label>Contenu</label><textarea id="bk" readonly></textarea><button class="btn" id="bkCopy">Copier</button><button class="btn sec" id="bkClose">Fermer</button>');
    $('bk').value=JSON.stringify(db);
    $('bkClose').onclick=closeSheet;
    $('bkCopy').onclick=function(){copyFrom($('bk'),markBackup);};
  }else if(b.id==='sImp'){
    openSheet('<h2>Restaurer</h2><div class="note">Colle ici une sauvegarde. Elle remplacera les données actuelles.</div><label>Contenu</label><textarea id="bk"></textarea><button class="btn" id="bkGo">Restaurer</button><button class="btn sec" id="bkClose">Annuler</button>');
    $('bkClose').onclick=closeSheet;
    $('bkGo').onclick=function(){
      try{
        var d=JSON.parse($('bk').value);
        if(!d||!d.txs||!d.cats||!d.rules||!d.settings)throw 0;
        db=d;migrate();save();closeSheet();render();toast('Sauvegarde restaurée');
      }catch(er){toast('Sauvegarde invalide');}
    };
  }else if(b.id==='sReset'){
    choose('Tout effacer ?',[
      {label:'Effacer toutes mes données',cls:'del',fn:function(){db=seed();migrate();sel=null;save();view={tab:'ops',q:'',cat:''};$('q').value='';render();toast('Données effacées');}},
      {label:'Annuler',cls:'sec'}]);
  }
};
$('sheetWrap').onclick=function(e){if(e.target===$('sheetWrap'))closeSheet();};

/* ---------- gestes sur les lignes ---------- */
var ACT=168,RMAX=120,sw=null,noClickUntil=0,lpTimer=null;
function closeOpenRows(except){
  Array.prototype.forEach.call($('content').querySelectorAll('.row.tx.open'),function(r){
    if(r===except)return;
    r.classList.remove('open');
    var rc=r.querySelector('.rc');rc.style.transition='';rc.style.transform='';
  });
}
$('content').addEventListener('pointerdown',function(e){
  var row=e.target.closest('.row.tx');
  closeOpenRows(row);
  if(sel)return;
  if(!row||e.target.closest('.acts')||e.target.closest('.chk'))return;
  sw={row:row,rc:row.querySelector('.rc'),x0:e.clientX,y0:e.clientY,pos:0,lock:null,base:row.classList.contains('open')?-ACT:0,id:e.pointerId};
  clearTimeout(lpTimer);
  lpTimer=setTimeout(function(){
    if(sw&&sw.row===row&&!sw.lock){var id=row.getAttribute('data-id');sw=null;noClickUntil=Date.now()+700;enterSel(id);}
  },450);
});
document.addEventListener('pointermove',function(e){
  if(sw&&(Math.abs(e.clientX-sw.x0)>8||Math.abs(e.clientY-sw.y0)>8))clearTimeout(lpTimer);
});
document.addEventListener('pointerup',function(){clearTimeout(lpTimer);});
document.addEventListener('pointercancel',function(){clearTimeout(lpTimer);});
$('content').addEventListener('contextmenu',function(e){if(e.target.closest('.row.tx'))e.preventDefault();});
function selIds(){return Object.keys(sel||{});}
function enterSel(id){
  closeOpenRows();sel={};sel[id]=true;render(true);
  try{if(navigator.vibrate)navigator.vibrate(15);}catch(er){}
}
function exitSel(){sel=null;render(true);}
function toggleSel(id){
  if(sel[id])delete sel[id];else sel[id]=true;
  if(!selIds().length){exitSel();return;}
  render(true);
}
$('selCheck').onclick=function(){
  var txs=selIds().map(txById).filter(Boolean);
  var all=txs.length&&txs.every(function(t){return t.checked;});
  var go=function(){txs.forEach(function(t){setChecked(t,!all);});
    sel=null;save();render(true);toast(all?'Pointage retiré':'Opérations pointées');};
  if(all)confirmUncheck(txs,go);else go();
};
$('selDel').onclick=function(){
  var ids=selIds(),n=ids.length;
  var hasTr=ids.some(function(id){var t=txById(id);return t&&t.transferId;});
  choose('Supprimer '+n+' opération'+(n>1?'s':'')+' ?',[
    {label:'Supprimer'+(hasTr?' (les virements sur les deux comptes)':''),cls:'del',fn:function(){
      var set={},tids={};
      ids.forEach(function(id){set[id]=1;var t=txById(id);if(t&&t.transferId)tids[t.transferId]=1;});
      var gone=db.txs.filter(function(t){return set[t.id]||(t.transferId&&tids[t.transferId]);});
      db.txs=db.txs.filter(function(t){return gone.indexOf(t)<0;});
      sel=null;save();render(true);
      undoToast(n+' opération'+(n>1?'s':'')+' supprimée'+(n>1?'s':''),function(){gone.forEach(function(g){db.txs.push(g);});save();render(true);});
    }},
    {label:'Annuler',cls:'sec'}]);
};
$('selCat').onclick=function(){
  var n=selIds().length;
  openSheet('<h2>Changer la catégorie</h2><div class="note">'+n+' opération'+(n>1?'s seront modifiées':' sera modifiée')+'. Les virements sont ignorés.</div><label>Nouvelle catégorie</label><input type="hidden" id="mCat" value=""><button type="button" class="fieldbtn" id="mCatBtn"></button><button class="btn" id="mGo">Appliquer</button><button class="btn sec" id="mCancel">Annuler</button>');
  $('mCancel').onclick=closeSheet;
  var chosenCat=false;
  $('mCatBtn').innerHTML=catBtnInner('',false);
  $('mCatBtn').onclick=function(){pickCategory($('mCat').value,function(id){$('mCat').value=id;chosenCat=true;$('mCatBtn').innerHTML=catBtnInner(id,true);});};
  $('mGo').onclick=function(){
    if(!chosenCat){toast('Choisis une catégorie');return;}
    var newC=catById($('mCat').value),skipped=0;
    selIds().forEach(function(id){
      var t=txById(id);if(!t)return;
      if(t.transferId){skipped++;return;}
      var oldC=catById(t.catId);
      var keep=t.title&&t.title!==(oldC?oldC.name:'Opération');
      t.catId=newC?newC.id:'';
      if(!keep)t.title=newC?newC.name:'Opération';
    });
    sel=null;save();closeSheet();render(true);
    toast('Catégorie modifiée'+(skipped?' ('+skipped+' virement'+(skipped>1?'s':'')+' ignoré'+(skipped>1?'s':'')+')':''));
  };
};
document.addEventListener('pointermove',function(e){
  if(!sw||e.pointerId!==sw.id)return;
  var dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.lock){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;sw.lock=Math.abs(dx)>Math.abs(dy)?'h':'v';}
  if(sw.lock!=='h')return;
  sw.pos=Math.max(-ACT,Math.min(RMAX,sw.base+dx));
  sw.rc.style.transition='none';
  sw.rc.style.transform='translateX('+sw.pos+'px)';
  sw.row.classList.toggle('right',sw.pos>0);
});
function endSwipe(e){
  if(!sw||e.pointerId!==sw.id)return;
  var s=sw;sw=null;
  if(s.lock!=='h')return;
  noClickUntil=Date.now()+350;
  s.rc.style.transition='';
  if(s.pos>80){
    var t=txById(s.row.getAttribute('data-id'));
    s.rc.style.transform='';s.row.classList.remove('open','right');
    if(t){
      if(t.checked){render(true);confirmUncheck([t],function(){setChecked(t,false);save();render(true);toast('Pointage retiré');});}
      else{var wasEst=t.est;pointTx(t,function(){save();render(true);toast(wasEst?'Pointée · montant réel enregistré':'Opération pointée');});}
    }
  }else if(s.pos<-ACT/2){
    s.row.classList.add('open');s.row.classList.remove('right');
    s.rc.style.transform='translateX(-'+ACT+'px)';
  }else{
    s.row.classList.remove('open','right');s.rc.style.transform='';
  }
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',endSwipe);

/* bouton « Retour » d'Android (utilisé par la version APK) : ferme d'abord ce qui est ouvert */
window.__appBack=function(){
  if($('dlg').classList.contains('show')){$('dlg').classList.remove('show');return true;}
  if(pk){closePick();return true;}
  if($('sheetWrap').classList.contains('show')){closeSheet();return true;}
  if(sel){exitSel();return true;}
  if(view.tab!=='ops'){view.tab='ops';render();return true;}
  return false;
};

load();
render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
</script>
